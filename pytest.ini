[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers for categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (requires TestClient)
    system: System tests (requires running Docker services)
    slow: Slow running tests

# Output and reporting options
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

# Coverage options (optional)
# --cov=src/backend-tmp/api
# --cov-report=html
# --cov-report=term-missing

# Minimum Python version
minversion = 3.9
